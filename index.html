<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cosméticos y Más</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8f8f8;
      font-family: Arial, sans-serif;
      color: #222;
    }

    .contenedor {
      text-align: center;
      padding: 30px;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .mensaje {
      font-size: 16px;
      color: #666;
    }

    .cargando {
      width: 35px;
      height: 35px;
      margin: 25px auto;
      border: 4px solid #ddd;
      border-top: 4px solid #222;
      border-radius: 50%;
      animation: girar 0.8s linear infinite;
    }

    @keyframes girar {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>

  <div class="contenedor">
    <div class="logo">Cosméticos y Más</div>
    <div class="cargando"></div>
    <div class="mensaje">
      Conectándote con una asesora...
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://bshnjamgshvlholwqyns.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_VYEl6yKyg64tP6MGF8LA_A_Orb6dLHP";

    async function asignarAsesora() {

      try {

        const respuesta = await fetch(
          `${SUPABASE_URL}/rest/v1/rpc/asignar_asesora`,
          {
            method: "POST",

            headers: {
              "apikey": SUPABASE_KEY,
              "Authorization": `Bearer ${SUPABASE_KEY}`,
              "Content-Type": "application/json"
            },

            body: JSON.stringify({})
          }
        );

        if (!respuesta.ok) {
          throw new Error(
            `Error de Supabase: ${respuesta.status}`
          );
        }

        const asesora = await respuesta.json();

        console.log("Asesora asignada:", asesora);

        if (!asesora || !asesora.whatsapp) {
          throw new Error("No se recibió un enlace de WhatsApp.");
        }

        // Redirección automática
        window.location.replace(asesora.whatsapp);

      } catch (error) {

        console.error(error);

        document.querySelector(".mensaje").textContent =
          "No pudimos conectarte automáticamente. Intenta nuevamente.";

        document.querySelector(".cargando").style.display = "none";
      }
    }

    asignarAsesora();
  </script>

</body>
</html>
